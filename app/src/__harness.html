<!DOCTYPE html><html><head><meta charset="UTF-8"><link rel="stylesheet" href="styles.css"></head>
<body><div id="app"></div>
<script>
const HOME="/Users/demo";
// whole-disk tree rooted at "/" (mirrors a real macOS layout)
const TREE={name:"",dir:true,kids:[
 {name:"Users",dir:true,kids:[{name:"demo",dir:true,size:185e9,phys:185e9},{name:"Shared",dir:true,size:4e9,phys:4e9}]},
 {name:"Applications",dir:true,kids:[{name:"Xcode.app",dir:true,size:30e9,phys:30e9},{name:"Docker.app",dir:true,size:8e9,phys:8e9}]},
 {name:"System",dir:true,size:21e9,phys:21e9},
 {name:"Library",dir:true,size:18e9,phys:18e9},
 {name:"private",dir:true,size:17e9,phys:17e9},
 {name:"opt",dir:true,size:12e9,phys:12e9}]};
function ann(n,path){n.path=(path==="/"?"":path)+"/"+n.name; if(!n.dir){n.count=0;n.phys=n.phys||0;return n;} n.kids=(n.kids||[]).map(k=>ann(k,n.path)); if(n.size==null)n.size=n.kids.reduce((a,k)=>a+k.size,0); if(n.phys==null)n.phys=n.kids.reduce((a,k)=>a+k.phys,0); n.count=n.kids.reduce((a,k)=>a+1+k.count,0); return n;}
TREE.path="/"; TREE.kids=TREE.kids.map(k=>ann(k,"/")); TREE.size=TREE.kids.reduce((a,k)=>a+k.size,0); TREE.phys=TREE.kids.reduce((a,k)=>a+k.phys,0); TREE.count=TREE.kids.reduce((a,k)=>a+1+k.count,0);
function find(r,p){if(r.path===p)return r; for(const k of r.kids||[]){const f=find(k,p); if(f)return f;} return null;}
function toNode(n,md,d){const o={path:n.path,size_bytes:n.size,alloc_bytes:n.phys,count:n.count||0,is_dir:!!n.dir,children:[]}; if(n.dir&&d<md)o.children=(n.kids||[]).map(k=>toNode(k,md,d+1)).sort((a,b)=>b.alloc_bytes-a.alloc_bytes); return o;}
function mock(cmd,args){
 if(cmd==="system_info")return Promise.resolve({home:HOME,full_disk_access:true});
 if(cmd==="disk_space")return Promise.resolve({total_bytes:494e9,available_bytes:68e9});
 if(cmd==="smart_status")return Promise.resolve("Verified");
 if(cmd==="size_tree"){const n=find(TREE,args.root); return n?Promise.resolve(toNode(n,args.maxDepth??1,0)):Promise.reject("nf");}
 if(cmd==="reclaim"){const b=(args.items||[]).reduce((a,i)=>a+Number(i.size_bytes||0),0); return Promise.resolve({reclaimed_bytes:b,succeeded:(args.items||[]).length,failed:0,outcomes:(args.items||[]).map(i=>({path:i.path,reclaimed_bytes:i.size_bytes,error:null}))});}
 return Promise.resolve(null);
}
window.__TAURI__={core:{invoke:mock,Channel:function(){}},event:{listen:()=>Promise.resolve(()=>{})}};
</script>
<script type="module" src="main.js"></script></body></html>
