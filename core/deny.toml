# cargo-deny configuration for the Tabibu Rust core.
#
# Enforced in CI (the `cargo-deny` job in .github/workflows/ci.yml); developers
# who want to run it locally install it with `cargo install cargo-deny`.

[graph]
all-features = false
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[advisories]
# Fail the build on any crate with a known security vulnerability.
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive allow-list: new dependencies under any of these pass; GPL and
# other copyleft licenses are NOT allowed and will (correctly) fail CI.
#
# NOTE on tabibu-malware: a future `clamav` feature will link libclamav,
# which is GPL-2.0. That dependency must stay behind an off-by-default
# feature and be dynamically linked / process-isolated; if it ever enters the
# default graph, this config will (correctly) fail CI, forcing an explicit
# decision rather than silent GPL contamination of the MIT-licensed core.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
]
# MPL-2.0 is file-level copyleft. We would prefer "warn", but the version-2
# licenses config in cargo-deny dropped per-license warn levels (allow-list
# only), so it sits in `allow` with this note: any crate introducing MPL-2.0
# code should be flagged in review and its file-level obligations checked.
# No MPL-2.0 crates are in the tree today.

[bans]
# Duplicate versions bloat the universal binary; warn so they show up in CI
# logs without blocking unrelated work.
multiple-versions = "warn"
# Deny external wildcard (`*`) version requirements, but NOT the intra-
# workspace path dependencies (`tabibu-engine.workspace = true` resolves to a
# path dep with no version, which cargo-deny would otherwise flag as a
# wildcard). Without this, `cargo deny check bans` fails on every internal
# crate edge — a GitHub-runner failure that doesn't reproduce as a build error.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
