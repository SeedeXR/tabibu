[package]
name = "tabibu-egui"
version = "0.1.0"
edition = "2021"
description = "Native egui desktop UI for Tabibu (replacing the Tauri webview shell). Phase 1: Space Analyzer."

[[bin]]
name = "tabibu-egui"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
tabibu-walk = { path = "../tabibu-walk" }
tabibu-engine = { path = "../tabibu-engine" }
tabibu-junk = { path = "../tabibu-junk" }
tabibu-sys = { path = "../tabibu-sys" }
tabibu-monitor = { path = "../tabibu-monitor" }
tabibu-dupes = { path = "../tabibu-dupes" }
tabibu-net = { path = "../tabibu-net" }
tabibu-malware = { path = "../tabibu-malware" }
tabibu-docker = { path = "../tabibu-docker" }
tabibu-devscan = { path = "../tabibu-devscan" }
tabibu-universal = { path = "../tabibu-universal" }
tabibu-brew = { path = "../tabibu-brew" }
tabibu-uninstall = { path = "../tabibu-uninstall" }

# Menu-bar shell (ports app/src-tauri/src/tray.rs to the standalone eframe build).
# Versions pinned to the same ones Tauri already resolves, so no new fetch.
tray-icon = "0.25"
global-hotkey = "0.8"
notify-rust = "4"
png = "0.18" # decode the bundled RGBA tray template (already in the lock via eframe)
